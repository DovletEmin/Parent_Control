version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mspy-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./app:/opt/mspy/app
    networks:
      - mspy-network

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mspy-celery
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker -l info -c 4
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/opt/mspy/app
    networks:
      - mspy-network

  postgres:
    image: postgres:16-alpine
    container_name: mspy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mspy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mspy_secret}
      POSTGRES_DB: ${POSTGRES_DB:-mspy_db}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mspy}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - mspy-network

  redis:
    image: redis:7-alpine
    container_name: mspy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - mspy-network

  minio:
    image: minio/minio:latest
    container_name: mspy-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mspy_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-mspy_minio_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - mspy-network

volumes:
  pg_data:
  redis_data:
  minio_data:

networks:
  mspy-network:
    driver: bridge
